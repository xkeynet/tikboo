name: TikBoo Embed Autopilot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož URL videa'
        required: true
      folder:
        description: 'Složka (adult / insta)'
        required: true
        type: choice
        options:
          - adult
          - insta

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Bez tohoto řádku se nic neuloží!
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spuštění skriptu
        run: python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"

      - name: Commit a Push změn
        run: |
          git config --global user.name "TikBoo Bot"
          git config --global user.email "bot@tikboo.com"
          git add db.json
          # Commitne změny pouze pokud existují
          git commit -m "Přidáno nové video: ${{ github.event.inputs.video_url }}" || echo "Žádné změny k uložení"
          git push
