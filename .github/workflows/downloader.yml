name: Tikboo Autopilot Run

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož URL adresu videa'
        required: true
      folder:
        description: 'Složka (insta / adult)'
        required: true
        default: 'insta'

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v3

      - name: Nastavení Pythonu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalace nástrojů
        run: |
          pip install yt-dlp boto3

      - name: Spuštění stahování a uploadu
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Teď předáváme oba parametry najednou jako argumenty, žádné EOF už není potřeba
          python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"
