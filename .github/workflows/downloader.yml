name: TikBoo R2 Video Autopilot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož odkaz na video nebo přímý MP4'
        required: true
      folder:
        description: 'Kategorie (adult / insta)'
        required: true
        type: choice
        options:
          - insta
          - adult
      title:
        description: 'Název videa'
        required: false

jobs:
  upload-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace knihoven
        run: pip install requests boto3 yt-dlp

      - name: Stažení videa a upload do R2
        run: python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}" "${{ github.event.inputs.title }}"

      - name: Uložení db.json do GitHubu
        run: |
          git config --global user.name "TikBoo Bot"
          git config --global user.email "bot@tikboo.com"
          git add db.json
          git commit -m "Upload videa do R2: ${{ github.event.inputs.title }}" || exit 0
          git push
