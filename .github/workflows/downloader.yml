Name: Tikboo Autopilot Universal

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož URL adresu videa (Instagram, YouTube, Adult, atd.)'
        required: true
      folder:
        description: 'Kategorie / Složka (např. nature, fitness, adult, insta)'
        required: true
        default: 'general'

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    
    # Přidáme timeout, aby nám to neběželo věčně u obřích videí
    timeout-minutes: 15 

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace stahovacích motorů
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp boto3

      - name: 🔥 SPOUŠTĚNÍ AUTOPILOTA
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Předáme parametry našemu univerzálnímu Python skriptu
          python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"
