name: TikBoo Embed Autopilot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož odkaz na video'
        required: true
      folder:
        description: 'Kategorie (adult / insta)'
        required: true
        type: choice
        options:
          - adult
          - insta

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace FFmpeg a Python knihoven
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests boto3

      - name: Spuštění autopilota
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CF_CUSTOM_DOMAIN: ${{ secrets.CF_CUSTOM_DOMAIN }}
        run: python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"
      
      - name: Uložení do GitHubu
        run: |
          git config --global user.name "TikBoo Bot"
          git config --global user.email "bot@tikboo.com"
          git add db.json
          git commit -m "Zápis videa: ${{ github.event.inputs.video_url }}" || exit 0
          git push
