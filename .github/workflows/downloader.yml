name: TikBoo Embed Autopilot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož odkaz na video (Instagram nebo Adult)'
        required: true
      folder:
        description: 'Kategorie (adult / insta)'
        required: true
        type: choice
        options:
          - insta
          - adult
      title:
        description: 'Název videa (např. Video by dreamfall.art)'
        required: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spuštění bleskového zápisu
        run: python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}" "${{ github.event.inputs.title }}"
      
      - name: Uložení do GitHubu
        run: |
          git config --global user.name "TikBoo Bot"
          git config --global user.email "bot@tikboo.com"
          git add db.json
          git commit -m "Zápis videa: ${{ github.event.inputs.title }}" || exit 0
          git push
