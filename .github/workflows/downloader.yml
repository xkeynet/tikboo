name: TikBoo Embed Autopilot

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož URL videa (XNXX, Pornhub, atd.)'
        required: true
      folder:
        description: 'Složka'
        required: true
        type: choice
        options:
          - adult
          - insta

jobs:
  update-database:
    runs-on: ubuntu-latest
    # Důležité: Povolíme zápis do repozitáře
    permissions:
      contents: write
      
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace (teď už jen základ)
        run: |
          pip install --upgrade pip
          # yt-dlp a boto3 už nepotřebujeme, náš nový skript je čistý Python

      - name: Spuštění autopilota (vytvoření embedu)
        run: |
          python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"

      - name: Uložení změn do db.json (Zápis do GitHubu)
        run: |
          git config --global user.name "TikBoo Bot"
          git config --global user.email "bot@tikboo.com"
          git add db.json
          # Commitne jen pokud se db.json změnil, jinak nehlásí chybu
          git commit -m "Přidáno nové video: ${{ github.event.inputs.video_url }}" || exit 0
          git push
