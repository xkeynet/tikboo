name: Tikboo Autopilot Run

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vlož URL adresu videa (Instagram Reel, atd.)'
        required: true
      folder:
        description: 'Cílová složka v R2 (insta / adult)'
        required: true
        default: 'insta'

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4 # Update na v4 pro lepší stabilitu

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5 # Update na v5 (standard 2026)
        with:
          python-version: '3.12' # Tady jsme se zbavili té staré 3.9

      - name: Instalace nástrojů
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp boto3 # Vynucujeme nejnovější verzi yt-dlp

      - name: Spuštění stahování a uploadu
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Spouštíme náš autopilot skript s parametry
          python autopilot.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.folder }}"
